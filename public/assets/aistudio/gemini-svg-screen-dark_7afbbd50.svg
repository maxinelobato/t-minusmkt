<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-splash-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#BF40FF" />
    </linearGradient>
    <filter id="neon-splash-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="10" stdDeviation="14" flood-color="#141416" flood-opacity="1" />
      <feDropShadow dx="-10" dy="-10" stdDeviation="14" flood-color="#343438" flood-opacity="0.7" />
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Tela Inteira (Zinc 800) -->
  <rect width="1080" height="2400" fill="#27272a" />

  <!-- Grupo Central: Logo Neon Neumórfica -->
  <g filter="url(#neon-splash-glow)" transform="translate(340, 820)">
    <!-- Botão Topo -->
    <path d="M 160 30 L 240 30 M 200 30 L 200 65" stroke="url(#neon-splash-grad)" stroke-width="16" stroke-linecap="round" />
    <!-- Círculo Principal -->
    <circle cx="200" cy="220" r="145" fill="none" stroke="url(#neon-splash-grad)" stroke-width="16" />
    <!-- Ponteiros/Marcas -->
    <line x1="200" y1="105" x2="200" y2="125" stroke="#00FFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="85" y1="220" x2="105" y2="220" stroke="#00FFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="200" y1="335" x2="200" y2="315" stroke="#BF40FF" stroke-width="6" stroke-linecap="round" />
    <line x1="315" y1="220" x2="295" y2="220" stroke="#BF40FF" stroke-width="6" stroke-linecap="round" />
    <!-- Seta de Crescimento -->
    <path d="M 110 310 L 340 80 M 250 80 L 340 80 L 340 170" fill="none" stroke="url(#neon-splash-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Texto da Marca Centralizado -->
  <text x="540" y="1360" text-anchor="middle" font-family="&#39;Inter&#39;, sans-serif" font-size="86" font-weight="800" fill="#ffffff" filter="url(#neon-splash-glow)">
    T-Minus <tspan fill="#39FF14" font-weight="500">Mkt</tspan>
  </text>

  <!-- Spinner de Carregamento Neon no Rodapé -->
  <g transform="translate(540, 1950)" filter="url(#neon-splash-glow)">
    <circle cx="0" cy="-45" r="9" fill="#00FFFF" />
    <circle cx="32" cy="-32" r="8" fill="#bf40ff" />
    <circle cx="45" cy="0" r="7" fill="#bf40ff" opacity="0.8" />
    <circle cx="32" cy="32" r="6" fill="#00FFFF" opacity="0.6" />
    <circle cx="0" cy="45" r="5" fill="#39FF14" opacity="0.4" />
    <circle cx="-32" cy="32" r="5" fill="#00FFFF" opacity="0.3" />
    <circle cx="-45" cy="0" r="6" fill="#bf40ff" opacity="0.5" />
    <circle cx="-32" cy="-32" r="7" fill="#00FFFF" opacity="0.8" />
  </g>
</svg>