<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" width="100%" height="100%">
  <defs>
    <filter id="neu-splash-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="16" flood-color="#c2c2c4" flood-opacity="1" />
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#ffffff" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Fundo Tela Inteira (Zinc 200) -->
  <rect width="1080" height="2400" fill="#e4e4e7" />

  <!-- Grupo Central: Logo Neumórfica -->
  <g filter="url(#neu-splash-light)" transform="translate(340, 820)">
    <!-- Botão Topo -->
    <path d="M 160 30 L 240 30 M 200 30 L 200 65" stroke="#e4e4e7" stroke-width="28" stroke-linecap="round" />
    <!-- Círculo Principal -->
    <circle cx="200" cy="220" r="145" fill="none" stroke="#e4e4e7" stroke-width="34" />
    <!-- Ponteiros/Marcas -->
    <line x1="200" y1="105" x2="200" y2="125" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round" />
    <line x1="85" y1="220" x2="105" y2="220" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round" />
    <line x1="200" y1="335" x2="200" y2="315" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round" />
    <line x1="315" y1="220" x2="295" y2="220" stroke="#a1a1aa" stroke-width="8" stroke-linecap="round" />
    <!-- Seta de Crescimento -->
    <path d="M 110 310 L 340 80 M 250 80 L 340 80 L 340 170" fill="none" stroke="#e4e4e7" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Texto da Marca Centralizado -->
  <text x="540" y="1360" text-anchor="middle" font-family="&#39;Inter&#39;, sans-serif" font-size="86" font-weight="800" fill="#27272a">
    T-Minus <tspan fill="#06b6d4" font-weight="500">Mkt</tspan>
  </text>

  <!-- Spinner de Carregamento Neumórfico no Rodapé -->
  <g transform="translate(540, 1950)" filter="url(#neu-splash-light)">
    <circle cx="0" cy="-45" r="9" fill="#71717a" />
    <circle cx="32" cy="-32" r="8" fill="#a1a1aa" />
    <circle cx="45" cy="0" r="7" fill="#a1a1aa" opacity="0.8" />
    <circle cx="32" cy="32" r="6" fill="#a1a1aa" opacity="0.6" />
    <circle cx="0" cy="45" r="5" fill="#a1a1aa" opacity="0.4" />
    <circle cx="-32" cy="32" r="5" fill="#a1a1aa" opacity="0.3" />
    <circle cx="-45" cy="0" r="6" fill="#a1a1aa" opacity="0.5" />
    <circle cx="-32" cy="-32" r="7" fill="#71717a" opacity="0.7" />
  </g>
</svg>